# Just the database. The API runs on your machine with uvicorn, so you keep
# --reload and a normal debugger.
#
#   docker compose up -d
#
# The volume means the data survives `docker compose down`. To start again
# from nothing: `docker compose down -v`.

services:
  db:
    image: postgres:16-alpine
    container_name: thinktank-db
    environment:
      POSTGRES_USER: thinktank
      POSTGRES_PASSWORD: thinktank
      POSTGRES_DB: thinktank
    ports:
      - "5432:5432"
    volumes:
      - thinktank-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinktank -d thinktank"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thinktank-pgdata:
